title: "나의 포트폴리오!!"
baseURL: 'https://yhj25.github.io/MyWebPage/'
languageCode: 'ko-kr'
titleCaseStyle: 'none'
theme: "neopost"

languages:
  ko:
    languageCode: ko-kr
    contentDir: content/ko
    languageName: 한국어
    weight: 1
    params:
      sidebar:
        tags:
          enable: true
          limit: 5
          more-text: "더 많은 태그"
      read-more:
        length-limit: 80
        text:
          more: "전체 보기"
          less: "줄이기"
  en:
    languageCode: en-us
    contentDir: content/en
    languageName: english
    weight: 2
    params:
      sidebar:
        tags:
          enable: true
          limit: 5
          more-text: "more tags..."
      read-more:
        length-limit: 120
        text:
          more: "read more"
          less: "read less"

permalinks:
  posts: "/posts/:filename/"

params:
  theme: "light-blue"
  favicon: "/favicon.ico"
  posts-per-page: 5
  toc-auto-numbering: false